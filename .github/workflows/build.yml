name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "source.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: unzip -o source.zip

      - name: Debug - show project.yml
        run: cat project.yml

      - name: Install XcodeGen and ldid
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project VTFViewerIOS.xcodeproj \
            -scheme VTFViewerIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Ad-hoc fakesign the app (ldid)
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app")
          ldid -S "$APP_PATH/VTFViewerIOS"

      - name: Package IPA (Payload/*.app -> .ipa)
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app")
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r VTFViewerIOS.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VTFViewerIOS-unsigned-ipa
          path: VTFViewerIOS.ipa
