name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip source project
        run: |
          unzip -o source.zip
          ls -la

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build App for REAL iOS Device (arm64)
        run: |
          # Ищем где лежит .xcodeproj файл после распаковки
          PROJ_PATH=$(find . -name "*.xcodeproj" -maxdepth 2 | head -n 1)
          echo "Found project at: $PROJ_PATH"
          
          xcodebuild build \
            -project "$PROJ_PATH" \
            -scheme VTFViewerIOS \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0

      - name: Package to IPA
        run: |
          mkdir -p Payload
          # Находим собранный .app файл вне зависимости от структуры папок
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r VTFViewerIOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VTFViewerIOS-IPA
          path: VTFViewerIOS.ipa
