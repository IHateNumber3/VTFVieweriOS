name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip source project
        run: |
          unzip -o source.zip

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project and Build IPA
        run: |
          # 1. Знаходимо де саме лежить project.yml
          YML_PATH=$(find . -name "project.yml" | head -n 1)
          if [ -z "$YML_PATH" ]; then
            echo "ERROR: project.yml not found!"
            exit 1
          fi
          
          WORK_DIR=$(dirname "$YML_PATH")
          cd "$WORK_DIR"
          echo "Working directory set to: $(pwd)"

          # 2. Генеруємо Xcode проект
          xcodegen generate

          # 3. Знаходимо згенерований .xcodeproj та його схему
          PROJ_FILE=$(ls -d *.xcodeproj | head -n 1)
          SCHEME_NAME=$(xcodebuild -list -project "$PROJ_FILE" | grep -A 10 "Schemes:" | tail -n +2 | xargs | awk '{print $1}')

          echo "Project file: $PROJ_FILE"
          echo "Scheme name: $SCHEME_NAME"

          # 4. Компілюємо під arm64 без підпису
          xcodebuild build \
            -project "$PROJ_FILE" \
            -scheme "$SCHEME_NAME" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            DEVELOPMENT_TEAM="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0

          # 5. Пакуємо в IPA
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r ../VTFViewerIOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VTFViewerIOS-IPA
          path: VTFViewerIOS.ipa
